# Integración continua: se ejecuta en cada push a main y en cada pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13"]
        include:
          # Ubuntu 26.04 (ubuntu-latest) ya no tiene Python 3.9: se prueba en 24.04.
          - os: ubuntu-24.04
            python: "3.9"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Pruebas del motor
        run: python -m unittest discover -s tests -v
      - name: Con el python3 del sistema de macOS (el que usa el bot)
        if: runner.os == 'macOS'
        run: /usr/bin/python3 -m unittest discover -s tests

  comprobaciones:
    name: Versiones, privacidad y validación del plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Versiones, cabeceras de las skills y datos personales
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python tools/check_release.py --base "origin/${{ github.base_ref }}"
          else
            python tools/check_release.py
          fi
      - name: Scripts de shell
        run: |
          for f in instalar.sh plugins/dongramo/bot/install.sh plugins/dongramo-cookidoo/install.sh; do bash -n "$f"; done
          shellcheck -S error instalar.sh plugins/dongramo/bot/install.sh plugins/dongramo-cookidoo/install.sh
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validar catálogo y plugins con Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.311
          claude plugin validate .
          claude plugin validate plugins/dongramo
          claude plugin validate plugins/dongramo-cookidoo
